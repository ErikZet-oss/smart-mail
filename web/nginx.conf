server {
  listen 8080;
  root /usr/share/nginx/html;

  location /api/ { proxy_pass http://app:8000; proxy_set_header Host $host; proxy_set_header X-Forwarded-For $remote_addr; proxy_set_header X-Forwarded-Proto $scheme; }
  location = /healthz { proxy_pass http://app:8000; }
  location = /readyz { proxy_pass http://app:8000; }

  # W2l (#46): the pdf.js worker is a bundled ES module; module workers need a JavaScript MIME type.
  location ~* \.mjs$ {
    types { }
    default_type text/javascript;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    try_files $uri =404;
  }

  # CLAUDE.md §11: strict CSP for the SPA (inline style attributes are used by React for computed sizes)
  location / {
    # B6: do NOT add https: to img-src — remote mail images go through /api/mail/image-proxy only.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
