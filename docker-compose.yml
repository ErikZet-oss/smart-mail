# Smart Mail — local/dev stack (CLAUDE.md §2, Phase 0).  `docker compose up --build`
# Web: http://localhost:8080 · API docs: http://localhost:8000/api/docs · Mailpit: http://localhost:8025
# MinIO console: http://localhost:9001 · Bridge (mock Money): http://localhost:8100/healthz
name: smart-mail

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-dev}
  APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
  APP_SECRET_KEY: ${APP_SECRET_KEY:-dev-only-change-me}
  DATABASE_URL: postgresql+asyncpg://smartmail:${POSTGRES_PASSWORD:-smartmail}@db:5432/smartmail
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://minio:9000
  S3_BUCKET: smartmail
  S3_ACCESS_KEY: ${MINIO_ROOT_USER:-smartmail}
  S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartmail-dev-secret}
  CLAMAV_HOST: clamav
  BRIDGE_URL: http://bridge:8100
  BRIDGE_HMAC_SECRET: ${BRIDGE_HMAC_SECRET:-dev-only-change-me}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: smartmail
      POSTGRES_USER: smartmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartmail}
    volumes: [db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmail -d smartmail"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartmail}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartmail-dev-secret}
    volumes: [minio-data:/data]
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  clamav:
    image: clamav/clamav:stable
    volumes: [clamav-data:/var/lib/clamav]
    # first start downloads signatures (a few minutes); the app does not wait for it in Phase 0
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  mailpit:
    image: axllent/mailpit:v1.21
    ports: ["127.0.0.1:1025:1025", "127.0.0.1:8025:8025"]

  bridge:
    build: ./bridge
    environment:
      MONEY_BACKEND: ${MONEY_BACKEND:-mock}
      MONEY_AGENDA_LABEL: ${MONEY_AGENDA_LABEL:-TEST}
      BRIDGE_HMAC_SECRET: ${BRIDGE_HMAC_SECRET:-dev-only-change-me}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8100:8100"]

  app:
    build: .
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      minio: { condition: service_healthy }
    ports: ["127.0.0.1:8000:8000"]

  worker:
    build: .
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment: *app-env
    healthcheck:
      disable: true
    depends_on:
      app: { condition: service_healthy }

  web:
    build: ./web
    depends_on:
      app: { condition: service_healthy }
    ports: ["127.0.0.1:8080:8080"]

volumes:
  db-data:
  minio-data:
  clamav-data:
