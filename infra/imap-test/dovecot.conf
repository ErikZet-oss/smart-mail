# Local TEST mail server for development and CI only (Phase 1c / 1h). Never exposed outside 127.0.0.1, fictional
# users only (infra/imap-test/users). Same Dovecot 2.3 as on Ubuntu 24.04; mirrors what the customer's server offers
# to Roundcube: IMAP with SPECIAL-USE, IDLE, CONDSTORE/QRESYNC, QUOTA and ManageSieve (Filtre / Mimo kancelárie).
# LMTP + local sendmail stub exist so vacation auto-replies can be integration-tested (Phase 1h-e).
protocols = imap sieve lmtp
listen = *
log_path = /dev/stderr
info_log_path = /dev/stdout

# test server: plain text on the local network only (the app refuses IMAP_LOGIN_SECURITY=none in prod)
ssl = no
disable_plaintext_auth = no
auth_mechanisms = plain login
sendmail_path = /usr/local/bin/vacation-sendmail

passdb {
  driver = passwd-file
  args = scheme=PLAIN username_format=%u /etc/dovecot/users
}
userdb {
  driver = passwd-file
  args = username_format=%u /etc/dovecot/users
  default_fields = uid=vmail gid=vmail home=/srv/mail/%d/%n
}

mail_location = maildir:~/Maildir
mail_plugins = $mail_plugins quota

namespace inbox {
  inbox = yes
  separator = /
  mailbox Drafts {
    special_use = \Drafts
    auto = subscribe
  }
  mailbox Sent {
    special_use = \Sent
    auto = subscribe
  }
  mailbox Junk {
    special_use = \Junk
    auto = subscribe
  }
  mailbox Trash {
    special_use = \Trash
    auto = subscribe
  }
}

protocol imap {
  mail_plugins = $mail_plugins imap_quota
  mail_max_userip_connections = 50
}

protocol lmtp {
  mail_plugins = $mail_plugins sieve
}

protocol lda {
  mail_plugins = $mail_plugins
}

plugin {
  quota = count:User quota
  quota_vsizes = yes
  quota_rule = *:storage=50M
  sieve = file:~/sieve;active=~/.dovecot.sieve
  # Vacation replies in tests must reach the fictional sender even without DNS.
  sieve_vacation_dont_check_recipient = yes
  # Allow :days 0 so integration tests can re-send without waiting a day.
  sieve_vacation_min_period = 0
}

service imap-login {
  inet_listener imap {
    port = 143
  }
  inet_listener imaps {
    port = 0
  }
}

service managesieve-login {
  inet_listener sieve {
    port = 4190
  }
}

service lmtp {
  inet_listener lmtp {
    port = 24
  }
}

service auth {
  unix_listener auth-userdb {
    mode = 0666
    user = vmail
    group = vmail
  }
}
