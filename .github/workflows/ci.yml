name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (app) — lint, types, tests, golden prints, audit
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: { POSTGRES_DB: smartmail_test, POSTGRES_USER: smartmail, POSTGRES_PASSWORD: smartmail }
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U smartmail" --health-interval 5s --health-timeout 5s --health-retries 20
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+asyncpg://smartmail:smartmail@localhost:5432/smartmail_test
      TEST_REDIS_URL: redis://localhost:6379/15
      REQUIRE_SERVICES: "1"  # DB/Redis tests must run in CI, never be skipped
    steps:
      - uses: actions/checkout@v4
      - name: System packages for WeasyPrint and golden print tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fontconfig libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          mkdir -p ~/.fonts && cp templates/print/fonts/*.ttf ~/.fonts/ && fc-cache -f
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - name: Local TEST IMAP (Dovecot) for Phase 1c / 1h-e integration tests
        run: |
          docker compose up -d --build imap-test
          for i in $(seq 1 30); do
            docker compose exec -T imap-test bash -c 'echo > /dev/tcp/127.0.0.1/143 && echo > /dev/tcp/127.0.0.1/4190 && echo > /dev/tcp/127.0.0.1/24 && echo > /dev/tcp/127.0.0.1/587' && break
            sleep 2
          done
          make imap-seed
      - name: Unit + IMAP integration tests
        env:
          TEST_IMAP_HOST: localhost
          TEST_IMAP_PORT: "1143"
          TEST_SIEVE_PORT: "4190"
          TEST_LMTP_PORT: "1024"
          TEST_SMTP_HOST: localhost
          TEST_SMTP_PORT: "1587"
          REQUIRE_IMAP: "1"
        run: uv run pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  bridge:
    name: Money bridge — lint, types, tests, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Schema drift — GraphQL queries and docs blocks vs graphql_schema.json
        run: uv run python ../tools/validate_graphql.py --schema schema/graphql_schema.json app/queries ../docs
      - name: No floats for money (CLAUDE.md §0.1)
        run: |
          if grep -rn --include='*.py' 'float(' app ../app/money ../app/orders ../app/purchasing ../app/offers 2>/dev/null; then
            echo "::error title=float( found::Use Decimal for money and quantities"; exit 1
          fi
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  web:
    name: Web — lint, format, types, tests, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tokens are a copy of design/tokens.css (CLAUDE.md §10)
        run: cmp ../design/tokens.css src/styles/tokens.css
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      # #121: the job log is not reachable through the proxy, so failures must surface as annotations (checks API):
      # the github-actions reporter names a failing test; if npm test dies outside a test (start-up, environment),
      # the next step turns the end of its output into an annotation. No retries.
      - name: npm test
        shell: bash
        run: |
          set -o pipefail
          npm test -- --reporter=default --reporter=github-actions 2>&1 | tee vitest-output.txt
      - name: npm test output (only when it failed)
        if: failure()
        shell: bash
        run: |
          tail -n 80 vitest-output.txt | sed 's/\x1b\[[0-9;]*m//g' > vitest-tail.txt || true
          msg=$(sed -e 's/%/%25/g' vitest-tail.txt | awk 'BEGIN{ORS="%0A"} {print}')
          echo "::error title=npm test output (last 80 lines)::${msg}"
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Web — Playwright e2e (desktop + mobile, API mocked)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
        env:
          SCREENSHOT_DIR: test-results/screens
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: web/test-results/
          retention-days: 14

  compose:
    name: docker compose up (Phase 0 acceptance)
    runs-on: ubuntu-24.04
    needs: [backend, bridge, web, e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Build images
        run: |
          set -o pipefail
          docker compose build --progress plain bridge app worker web 2>&1 | tee /tmp/build.log
      - name: Start the stack (ClamAV is skipped in CI — it downloads signatures for minutes)
        run: |
          set -o pipefail
          docker compose up -d db redis s3 mailpit bridge app worker web 2>&1 | tee /tmp/up.log
      - name: Wait until app, bridge and web answer
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/readyz >/dev/null && curl -fsS http://localhost:8100/healthz >/dev/null \
               && curl -fsS http://localhost:8080/ >/dev/null; then echo "ready after $((i*5)) s"; exit 0; fi
            sleep 5
          done
          echo "stack not ready after 300 s" | tee -a /tmp/up.log
          exit 1
      - name: Smoke test
        run: |
          set -ex
          exec > >(tee -a /tmp/up.log) 2>&1
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/readyz
          curl -fsS http://localhost:8100/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/readyz
          docker compose exec -T db psql -U smartmail -d smartmail -tAc "select extname from pg_extension order by 1" | tee /tmp/ext.txt
          grep -q vector /tmp/ext.txt && grep -q unaccent /tmp/ext.txt
          sleep 5
          docker compose exec -T redis redis-cli get smartmail:worker:heartbeat | grep -q T
      - name: Logs on failure (also as annotations, readable from the API)
        if: failure()
        run: |
          docker compose ps -a
          docker compose logs --no-color --tail=200
          enc() { python3 -c 'import sys,urllib.parse;d=sys.stdin.read()[-6000:];print(d.replace("%","%25").replace("\r","").replace("\n","%0A"))'; }
          [ -f /tmp/build.log ] && echo "::error title=build log::$(grep -iE 'error|failed|unable|not found' /tmp/build.log | tail -40 | enc)"
          [ -f /tmp/up.log ] && echo "::error title=up log::$(tail -40 /tmp/up.log | enc)"
          echo "::error title=compose ps::$(docker compose ps -a --format '{{.Service}} {{.State}} {{.Health}} {{.ExitCode}}' | enc)"
          for svc in db redis s3 mailpit bridge app worker web; do
            echo "::error title=logs $svc::$(docker compose logs --no-color --tail=40 $svc 2>&1 | enc)"
          done
      - if: always()
        run: docker compose down -v

  deploy:
    name: Deploy scripts (install + update smoke, no cert / tunnel)
    runs-on: ubuntu-24.04
    # Independent of unit/e2e jobs so a backend failure cannot skip the deploy smoke.
    steps:
      - uses: actions/checkout@v4
      - name: Windows bridge scripts parse (ADR-016, PowerShell syntax only)
        shell: pwsh
        run: |
          $bad = 0
          foreach ($f in Get-ChildItem deploy/bridge-windows/*.ps1) {
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$null, [ref]$errors)
            if ($errors) { $errors | ForEach-Object { Write-Host "::error file=$($f.Name)::$_" }; $bad++ }
            else { Write-Host "OK $($f.Name)" }
          }
          exit $bad
      - name: install.sh + update.sh (SMARTMAIL_CI=1)
        run: |
          chmod +x deploy/*.sh
          ./deploy/ci-smoke.sh
      - name: Logs on failure
        if: failure()
        working-directory: deploy
        run: |
          docker compose --env-file .env.ci -f docker-compose.yml ps -a || true
          docker compose --env-file .env.ci -f docker-compose.yml logs --no-color --tail=80 || true
      - if: always()
        working-directory: deploy
        run: |
          if [[ -f .env.ci ]]; then
            docker compose --env-file .env.ci -f docker-compose.yml down -v || true
          fi

