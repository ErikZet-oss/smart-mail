name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (app) — lint, types, tests, golden prints, audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: System packages for WeasyPrint and golden print tests
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends poppler-utils fontconfig libpango-1.0-0 libpangoft2-1.0-0 libharfbuzz-subset0
          mkdir -p ~/.fonts && cp templates/print/fonts/*.ttf ~/.fonts/ && fc-cache -f
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  bridge:
    name: Money bridge — lint, types, tests, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: bridge
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --frozen --python 3.12
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest -q
      - name: Dependency audit (pip-audit)
        run: |
          uv export --frozen --format requirements-txt > /tmp/requirements.txt
          uvx pip-audit -r /tmp/requirements.txt --disable-pip

  web:
    name: Web — lint, format, types, tests, build, audit
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Tokens are a copy of design/tokens.css (CLAUDE.md §10)
        run: cmp ../design/tokens.css src/styles/tokens.css
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  compose:
    name: docker compose up (Phase 0 acceptance)
    runs-on: ubuntu-24.04
    needs: [backend, bridge, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack (ClamAV is skipped in CI — it downloads signatures for minutes)
        run: docker compose up -d --build --wait db redis minio mailpit bridge app worker web
      - name: Smoke test
        run: |
          set -e
          curl -fsS http://localhost:8000/healthz
          curl -fsS http://localhost:8000/readyz
          curl -fsS http://localhost:8100/healthz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8080/readyz
          docker compose exec -T db psql -U smartmail -d smartmail -tAc "select extname from pg_extension order by 1" | tee /tmp/ext.txt
          grep -q vector /tmp/ext.txt && grep -q unaccent /tmp/ext.txt
          sleep 5
          docker compose exec -T redis redis-cli get smartmail:worker:heartbeat | grep -q T
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - if: always()
        run: docker compose down -v
