# VPS mode (Caddy edge). Real client IP for D26 login limits + audit.
# Never overwrite X-Forwarded-For with $remote_addr alone — that drops the client IP from Caddy.
# Never prefer CF-Connecting-IP here — clients can spoof it through Caddy; Caddy strips it too.

# Trust only the Docker network (Caddy peers), never the public internet.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Proto comes from Caddy; fall back when plain HTTP in CI.
map $http_x_forwarded_proto $sm_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    # VPS: only the Caddy XFF chain (+ this hop). CF-Connecting-IP is ignored (and stripped by Caddy).
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sm_forwarded_proto;
  }
  location = /healthz { proxy_pass http://app:8000; }
  location = /readyz { proxy_pass http://app:8000; }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
