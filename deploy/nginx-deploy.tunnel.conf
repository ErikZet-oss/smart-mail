# Tunnel mode (cloudflared edge). Real client IP for D26 login limits + audit.
# Cloudflare sets CF-Connecting-IP; only this mode may prefer it (clients cannot reach nginx directly).

# Trust only the Docker network (cloudflared peers), never the public internet.
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
real_ip_header X-Forwarded-For;
real_ip_recursive on;

# Tunnel: Cloudflare's CF-Connecting-IP is the client; else append to any existing XFF chain.
map $http_cf_connecting_ip $sm_forwarded_for {
    ""      $proxy_add_x_forwarded_for;
    default $http_cf_connecting_ip;
}

map $http_x_forwarded_proto $sm_forwarded_proto {
    ""      $scheme;
    default $http_x_forwarded_proto;
}

server {
  listen 80;
  root /usr/share/nginx/html;

  location /api/ {
    proxy_pass http://app:8000;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $sm_forwarded_for;
    proxy_set_header X-Forwarded-Proto $sm_forwarded_proto;
  }
  location = /healthz { proxy_pass http://app:8000; }
  location = /readyz { proxy_pass http://app:8000; }

  location / {
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;
    try_files $uri /index.html;
  }
}
