# Smart Mail — VPS / tunnel deploy stack (ADR-010). Used by deploy/install.sh.
# No Mailpit, no imap-test. Caddy (profile vps) or cloudflared (profile tunnel) is the only public edge.
name: smart-mail

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-test}
  APP_BASE_URL: ${APP_BASE_URL}
  APP_SECRET_KEY: ${APP_SECRET_KEY}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
  DATABASE_URL: postgresql+asyncpg://smartmail:${POSTGRES_PASSWORD}@db:5432/smartmail
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://s3:8333
  S3_BUCKET: smartmail
  S3_ACCESS_KEY: ${S3_ACCESS_KEY}
  S3_SECRET_KEY: ${S3_SECRET_KEY}
  STORAGE_BACKEND: s3
  SMTP_HOST: ${SMTP_HOST}
  SMTP_PORT: ${SMTP_PORT:-465}
  SMTP_SECURITY: ${SMTP_SECURITY:-ssl}
  UNDO_SEND_SECONDS: ${UNDO_SEND_SECONDS:-10}
  CLAMAV_HOST: clamav
  BRIDGE_URL: http://bridge:8100
  BRIDGE_HMAC_SECRET: ${BRIDGE_HMAC_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  IMAP_LOGIN_HOST: ${IMAP_LOGIN_HOST:-mail2.nameserver.sk}
  IMAP_LOGIN_PORT: ${IMAP_LOGIN_PORT:-993}
  IMAP_LOGIN_SECURITY: ${IMAP_LOGIN_SECURITY:-ssl}
  INTERNAL_DOMAINS: ${INTERNAL_DOMAINS:-smartsro.sk}
  ADMIN_EMAILS: ${ADMIN_EMAILS:-}
  ADMIN_CONTACT_EMAIL: ${ADMIN_CONTACT_EMAIL:-}
  LOGIN_ALLOWLIST: ${LOGIN_ALLOWLIST:-}
  LOGIN_IP_ALLOWLIST: ${LOGIN_IP_ALLOWLIST:-}
  FORWARDED_ALLOW_IPS: ${FORWARDED_ALLOW_IPS:-*}
  MAIL_SYNC_ENABLED: ${MAIL_SYNC_ENABLED:-true}
  MAIL_POLL_SECONDS: ${MAIL_POLL_SECONDS:-120}
  MAIL_IDLE_RENEW_SECONDS: ${MAIL_IDLE_RENEW_SECONDS:-1500}
  MAIL_SYNC_BATCH: ${MAIL_SYNC_BATCH:-500}
  MAIL_SYNC_ALLOW_REAL_SERVER: ${MAIL_SYNC_ALLOW_REAL_SERVER:-true}
  MAIL_SEND_ALLOW_REAL_SERVER: ${MAIL_SEND_ALLOW_REAL_SERVER:-true}
  MAIL_SEND_TEST_ALLOWLIST: ${MAIL_SEND_TEST_ALLOWLIST:-}
  FEATURE_MONEY: ${FEATURE_MONEY:-false}
  MONEY_BACKEND: ${MONEY_BACKEND:-mock}
  MONEY_AGENDA_LABEL: ${MONEY_AGENDA_LABEL:-TEST}

services:
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartmail
      POSTGRES_USER: smartmail
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes: [db-data:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartmail -d smartmail"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  s3:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    command: ["server", "-s3", "-dir=/data", "-ip.bind=0.0.0.0"]
    volumes: [s3-data:/data]
    ports: ["127.0.0.1:8333:8333"]

  clamav:
    image: clamav/clamav:stable
    restart: unless-stopped
    volumes: [clamav-data:/var/lib/clamav]
    ports: ["127.0.0.1:3310:3310"]
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 20
      start_period: 300s

  bridge:
    build:
      context: ../bridge
    image: smart-mail-bridge:deploy
    restart: unless-stopped
    environment:
      MONEY_BACKEND: ${MONEY_BACKEND:-mock}
      MONEY_AGENDA_LABEL: ${MONEY_AGENDA_LABEL:-TEST}
      BRIDGE_HMAC_SECRET: ${BRIDGE_HMAC_SECRET}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ports: ["127.0.0.1:8100:8100"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8100/healthz"]
      interval: 15s
      timeout: 3s
      retries: 10

  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: smart-mail-app:deploy
    restart: unless-stopped
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
      s3: { condition: service_started }
      bridge: { condition: service_started }
    ports: ["127.0.0.1:8000:8000"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/readyz"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  worker:
    image: smart-mail-app:deploy
    restart: unless-stopped
    command: ["arq", "app.workers.worker.WorkerSettings"]
    environment: *app-env
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      disable: true

  web:
    build:
      context: ../web
      dockerfile: Dockerfile
    image: smart-mail-web:deploy
    restart: unless-stopped
    depends_on:
      app: { condition: service_healthy }
    ports: ["127.0.0.1:8080:80"]
    volumes:
      - ./nginx-deploy.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10

  caddy:
    profiles: ["vps"]
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web: { condition: service_healthy }

  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2024.10.0
    restart: unless-stopped
    command: ["tunnel", "--no-autoupdate", "run", "--token", "${CLOUDFLARE_TUNNEL_TOKEN}"]
    depends_on:
      web: { condition: service_healthy }

volumes:
  db-data:
  s3-data:
  clamav-data:
  caddy-data:
  caddy-config:
